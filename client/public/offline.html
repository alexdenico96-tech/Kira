<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kira — sem conexão</title>
<meta name="theme-color" content="#0B0614">
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#2a1650 0,#0B0614 60%);color:#f3efff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  img{width:84px;height:84px;border-radius:22px;box-shadow:0 18px 50px -12px rgba(124,92,255,.6)}
  h1{font-size:22px;margin:22px 0 8px} p{margin:0 auto;max-width:320px;color:#b9b0d6;line-height:1.5;font-size:15px}
  button{margin-top:24px;border:0;border-radius:14px;padding:12px 22px;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,#7c5cff,#3b82f6);cursor:pointer}
</style>
</head>
<body>
  <main>
    <img src="/favicon-192.png" alt="Kira">
    <h1>Sem conexão com a internet</h1>
    <p>A Kira precisa de internet para conversar. Assim que a conexão voltar, toque em tentar de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
  <script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
